name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build backend
        shell: bash
        run: bash ci/github-actions-build-backend.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        shell: bash
        run: bash ci/github-actions-build-frontend.sh

  # 在双端编译通过后：起 PostgreSQL → migrate → 启动 API → 根目录 smoke（脚本见 ci/）
  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_reminder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_reminder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_reminder?schema=public
      JWT_SECRET: ci-jwt-secret-for-github-actions-only
      PORT: '8089'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Migrate, start API, smoke
        shell: bash
        run: bash ci/github-actions-integration.sh
